name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual escape hatch: dispatch against a TAG ref (gh workflow run
  # Release --ref vX.Y.Z) when a tag-push event fails to fire — observed
  # 2026-08-06 (tags v1.3.111/112 created no runs while other pushes did).
  workflow_dispatch:

# Least privilege at the top; each job grants only what it needs.
permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release
      packages: write      # push images + attestations to GHCR
      id-token: write      # keyless (Sigstore/Fulcio) provenance signing
      attestations: write  # record SLSA build provenance
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin image
        id: img-admin
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/admin/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gatewaze/admin:${{ steps.version.outputs.VERSION }}
            ghcr.io/gatewaze/admin:latest
          no-cache: true
          # The Dockerfile pre-builds the admin Vite bundle at image
          # build time using a superset of module sources so pod
          # cold-starts can skip the 3-5 min runtime rebuild.
          #
          # We MUST use a PAT (GH_PAT_MODULES), not the auto-token —
          # `secrets.GITHUB_TOKEN` only grants access to the current
          # repo, so it CANNOT clone the private
          # gatewaze-modules. v1.2.28 was built with the
          # auto-token; the premium clone failed silently and the
          # bundle shipped without any premium modules (every
          # event-* module disappeared from the admin UI). The PAT
          # has read access to all three module repos.
          build-args: |
            BUILD_TIME_GITHUB_TOKEN=${{ secrets.GH_PAT_MODULES }}

      - name: Build and push portal image
        id: img-portal
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/portal/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gatewaze/portal:${{ steps.version.outputs.VERSION }}
            ghcr.io/gatewaze/portal:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Portal now bakes module npm deps at build time (mirrors
          # the api + worker + admin pattern). The Dockerfile clones
          # BUILD_TIME_MODULE_SOURCES and aggregates their declared
          # deps into the workspace install so `next build` at pod
          # startup can resolve module-side packages without a
          # per-pod aggregate-and-install. PAT, not auto-token, in
          # case any baked source repo is private (lf-gatewaze-modules
          # historically required it).
          build-args: |
            BUILD_TIME_GITHUB_TOKEN=${{ secrets.GH_PAT_MODULES }}

      - name: Build and push api image
        id: img-api
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gatewaze/api:${{ steps.version.outputs.VERSION }}
            ghcr.io/gatewaze/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The Dockerfile bakes module npm deps (openai for the AI
          # module, ws for editor-ai-copilot, etc.) at build time so
          # pod startup doesn't have to do per-module pnpm installs.
          # Mirrors the admin build — PAT, not auto-token, because
          # gatewaze-modules + lf-gatewaze-modules are private.
          build-args: |
            BUILD_TIME_GITHUB_TOKEN=${{ secrets.GH_PAT_MODULES }}

      - name: Build and push worker image
        id: img-worker
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/worker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gatewaze/worker:${{ steps.version.outputs.VERSION }}
            ghcr.io/gatewaze/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Worker bakes module npm deps at build time (same reason
          # as the api image) — it dispatches BullMQ jobs to module-
          # side handlers that require() module-declared deps like
          # `openai`. Needs the PAT, not the auto-token, to clone the
          # private gatewaze-modules + lf-gatewaze-modules.
          build-args: |
            BUILD_TIME_GITHUB_TOKEN=${{ secrets.GH_PAT_MODULES }}

      - name: Build and push se-runner image
        id: img-se-runner
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/se-runner/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gatewaze/se-runner:${{ steps.version.outputs.VERSION }}
            ghcr.io/gatewaze/se-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Lean software-engineer runner (SE-runner split): bakes ONLY the
          # software-engineer module's deps. Needs the PAT for the same
          # module-clone reason as the worker image.
          build-args: |
            BUILD_TIME_GITHUB_TOKEN=${{ secrets.GH_PAT_MODULES }}

      - name: Build and push mcp-public image
        id: img-mcp-public
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: packages/mcp
          file: packages/mcp/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gatewaze/mcp-public:${{ steps.version.outputs.VERSION }}
            ghcr.io/gatewaze/mcp-public:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Self-contained npm build (only external deps) — no module
          # sources or PAT needed, unlike the app images above.

      - name: Build and push scheduler image
        id: img-scheduler
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/scheduler/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gatewaze/scheduler:${{ steps.version.outputs.VERSION }}
            ghcr.io/gatewaze/scheduler:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Scheduler dynamic-imports each module's scheduler handler
          # via loadModules() at startup; same dep-resolution issue
          # as the api + worker.
          build-args: |
            BUILD_TIME_GITHUB_TOKEN=${{ secrets.GH_PAT_MODULES }}

      - name: Build and push scrapling-fetcher image
        id: img-scrapling-fetcher
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: services/scrapling-fetcher
          file: services/scrapling-fetcher/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gatewaze/scrapling-fetcher:${{ steps.version.outputs.VERSION }}
            ghcr.io/gatewaze/scrapling-fetcher:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Self-contained Python/FastAPI service (Scrapling on the Playwright
          # base image). No module sources, so no BUILD_TIME_GITHUB_TOKEN.
          # See docs/spec-scrapling-fetcher-service.md §4.1. gatewaze ghcr
          # packages are public, so the cluster pulls this with no pull secret.

      # SLSA build provenance (build level 2): keyless, signed, tied to
      # this workflow. Consumers verify with:
      #   gh attestation verify oci://ghcr.io/gatewaze/<image>:<tag> --owner gatewaze
      - name: Attest admin provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/gatewaze/admin
          subject-digest: ${{ steps.img-admin.outputs.digest }}
          push-to-registry: true

      - name: Attest portal provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/gatewaze/portal
          subject-digest: ${{ steps.img-portal.outputs.digest }}
          push-to-registry: true

      - name: Attest api provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/gatewaze/api
          subject-digest: ${{ steps.img-api.outputs.digest }}
          push-to-registry: true

      - name: Attest worker provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/gatewaze/worker
          subject-digest: ${{ steps.img-worker.outputs.digest }}
          push-to-registry: true

      - name: Attest mcp-public provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/gatewaze/mcp-public
          subject-digest: ${{ steps.img-mcp-public.outputs.digest }}
          push-to-registry: true

      - name: Attest scheduler provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/gatewaze/scheduler
          subject-digest: ${{ steps.img-scheduler.outputs.digest }}
          push-to-registry: true

      - name: Attest scrapling-fetcher provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/gatewaze/scrapling-fetcher
          subject-digest: ${{ steps.img-scrapling-fetcher.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          generate_release_notes: true

  publish-connect:
    name: Publish @gatewaze/connect to npm
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      id-token: write   # npm publish --provenance (keyless SLSA provenance)
    # npm-side failures (2FA policy, registry hiccups) must not mark the
    # whole release red — images and chart are the load-bearing artifacts.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Publishes the connector-installer CLI on every release tag, versioned
      # in lockstep with the platform. Skips gracefully (with a notice) when
      # NPM_TOKEN isn't configured, and when this version is already
      # published (re-tag / re-run safety).
      - name: Publish
        working-directory: packages/connect
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN not configured — skipping @gatewaze/connect publish"
            exit 0
          fi
          if npm view "@gatewaze/connect@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::@gatewaze/connect@$VERSION already published — skipping"
            exit 0
          fi
          npm install --no-audit --no-fund
          npm run build
          npm version "$VERSION" --no-git-tag-version
          # --provenance emits signed SLSA build provenance to the npm
          # registry (requires the id-token: write permission above).
          npm publish --access public --provenance
