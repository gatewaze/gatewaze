name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual escape hatch: dispatch against a TAG ref (gh workflow run
  # Release --ref vX.Y.Z) when a tag-push event fails to fire — observed
  # 2026-08-06 (tags v1.3.111/112 created no runs while other pushes did).
  workflow_dispatch:

# Least privilege at the top; each job grants only what it needs.
permissions:
  contents: read

jobs:
  # One job per image, run in parallel. Previously all eight images built
  # sequentially in a single job, which made the release bounded by their
  # sum (1653s / 27.5 min measured on v1.3.154) rather than by the slowest
  # image (portal, 337s).
  #
  # There is deliberately NO build cache here. The images each clone
  # gatewaze-modules at `#branch=main` in a RUN whose text never changes,
  # and that layer bakes the module npm deps. A cache that actually hit
  # would reuse a stale clone and ship an image whose baked deps predate a
  # module's new dependency, which is how the portal crash-looped on
  # `Module not found: qrcode` in Oct 2026. The previous
  # `cache-to: type=gha,mode=max` cost 727s per release to write a cache
  # the next release could not read (Actions cache entries are keyed by git
  # ref, and every release runs on a fresh tag), and it kept the repo's
  # 10GB Actions cache permanently full, which evicted the PR jobs'
  # pnpm caches as a side effect. Caching the installs is only safe once
  # the module clone layers take a cache-busting build arg derived from the
  # module repos' commit SHAs.
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout only; the Release is created in its own job
      packages: write      # push images + attestations to GHCR
      id-token: write      # keyless (Sigstore/Fulcio) provenance signing
      attestations: write  # record SLSA build provenance
    strategy:
      # One image failing must not cancel the other seven. A release that
      # pushes 7/8 images and names the one that broke is easier to recover
      # than a release that cancels mid-flight.
      fail-fast: false
      matrix:
        include:
          # We MUST use a PAT (GH_PAT_MODULES), not the auto-token, wherever
          # `pat: true` appears — `secrets.GITHUB_TOKEN` only grants access to
          # the current repo, so it CANNOT clone the private gatewaze-modules.
          # v1.2.28 was built with the auto-token; the premium clone failed
          # silently and the bundle shipped without any premium modules (every
          # event-* module disappeared from the admin UI). The PAT has read
          # access to all three module repos.

          # The Dockerfile pre-builds the admin Vite bundle at image build
          # time using a superset of module sources so pod cold-starts can
          # skip the 3-5 min runtime rebuild. `no_cache` is kept as a belt-
          # and-braces marker: it predates this job having no cache at all,
          # and it documents that this image must never reuse a layer.
          - image: admin
            context: .
            file: docker/admin/Dockerfile
            pat: true
            no_cache: true

          # Portal bakes module npm deps at build time (mirrors the api +
          # worker + admin pattern). The Dockerfile clones
          # BUILD_TIME_MODULE_SOURCES and aggregates their declared deps into
          # the workspace install so `next build` at pod startup can resolve
          # module-side packages without a per-pod aggregate-and-install.
          - image: portal
            context: .
            file: docker/portal/Dockerfile
            pat: true
            no_cache: false

          # The Dockerfile bakes module npm deps (openai for the AI module,
          # ws for editor-ai-copilot, etc.) at build time so pod startup
          # doesn't have to do per-module pnpm installs.
          - image: api
            context: .
            file: docker/api/Dockerfile
            pat: true
            no_cache: false

          # Worker bakes module npm deps at build time (same reason as the
          # api image) — it dispatches BullMQ jobs to module-side handlers
          # that require() module-declared deps like `openai`.
          - image: worker
            context: .
            file: docker/worker/Dockerfile
            pat: true
            no_cache: false

          # Lean software-engineer runner (SE-runner split): bakes ONLY the
          # software-engineer module's deps.
          - image: se-runner
            context: .
            file: docker/se-runner/Dockerfile
            pat: true
            no_cache: false

          # Self-contained npm build (only external deps) — no module
          # sources or PAT needed, unlike the app images above.
          - image: mcp-public
            context: packages/mcp
            file: packages/mcp/Dockerfile
            pat: false
            no_cache: false

          # Scheduler dynamic-imports each module's scheduler handler via
          # loadModules() at startup; same dep-resolution issue as the api +
          # worker.
          - image: scheduler
            context: .
            file: docker/scheduler/Dockerfile
            pat: true
            no_cache: false

          # Self-contained Python/FastAPI service (Scrapling on the Playwright
          # base image). No module sources, so no PAT. See
          # docs/spec-scrapling-fetcher-service.md §4.1. gatewaze ghcr
          # packages are public, so the cluster pulls this with no pull secret.
          - image: scrapling-fetcher
            context: services/scrapling-fetcher
            file: services/scrapling-fetcher/Dockerfile
            pat: false
            no_cache: false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }} image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/gatewaze/${{ matrix.image }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/gatewaze/${{ matrix.image }}:latest
          no-cache: ${{ matrix.no_cache || false }}
          # Empty lines are dropped by the action's list parser, so an image
          # that needs neither arg passes none.
          build-args: |
            ${{ matrix.pat && format('BUILD_TIME_GITHUB_TOKEN={0}', secrets.GH_PAT_MODULES) || '' }}
            ${{ matrix.image == 'admin' && format('ADMIN_IMAGE_VERSION={0}', steps.version.outputs.VERSION) || '' }}

      # SLSA build provenance (build level 2): keyless, signed, tied to
      # this workflow. Consumers verify with:
      #   gh attestation verify oci://ghcr.io/gatewaze/<image>:<tag> --owner gatewaze
      #
      # se-runner had no attestation step before the matrix split. Nothing
      # about that image makes it an exception, so it is attested too.
      - name: Attest ${{ matrix.image }} provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/gatewaze/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Split out of the build job so that job no longer needs `contents: write`.
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          generate_release_notes: true

  publish-connect:
    name: Publish @gatewaze/connect to npm
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      id-token: write   # npm publish --provenance (keyless SLSA provenance)
    # npm-side failures (2FA policy, registry hiccups) must not mark the
    # whole release red — images and chart are the load-bearing artifacts.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Publishes the connector-installer CLI on every release tag, versioned
      # in lockstep with the platform. Skips gracefully (with a notice) when
      # NPM_TOKEN isn't configured, and when this version is already
      # published (re-tag / re-run safety).
      - name: Publish
        working-directory: packages/connect
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN not configured — skipping @gatewaze/connect publish"
            exit 0
          fi
          if npm view "@gatewaze/connect@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::@gatewaze/connect@$VERSION already published — skipping"
            exit 0
          fi
          npm install --no-audit --no-fund
          npm run build
          npm version "$VERSION" --no-git-tag-version
          # --provenance emits signed SLSA build provenance to the npm
          # registry (requires the id-token: write permission above).
          npm publish --access public --provenance
