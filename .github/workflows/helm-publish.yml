name: Publish Helm Chart

on:
  push:
    tags:
      - 'v*'

# Least privilege at the top; the job grants only what it needs.
permissions:
  contents: read

jobs:
  publish:
    name: Package & Publish Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: write      # commit the packaged chart to gh-pages
      packages: write      # push a signed OCI copy to GHCR
      id-token: write      # keyless cosign signing + provenance
      attestations: write  # record SLSA build provenance for the chart
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.0

      - name: Update chart version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.VERSION }}/" helm/gatewaze/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.VERSION }}\"/" helm/gatewaze/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package helm/gatewaze --destination .helm-packages

      # --- Signed OCI copy + SLSA provenance (additive; the gh-pages
      # Helm repo below is unchanged and remains the primary consumer path) ---
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR (OCI) and sign
        id: oci
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHART=".helm-packages/gatewaze-${VERSION}.tgz"
          # `helm push` prints the pushed digest on stderr; capture it.
          digest=$(helm push "$CHART" oci://ghcr.io/gatewaze/charts 2>&1 | tee /dev/stderr | awk '/Digest:/ {print $2}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          # Keyless signature (Sigstore/Fulcio) tied to this workflow's OIDC identity.
          cosign sign --yes "ghcr.io/gatewaze/charts/gatewaze@${digest}"

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/gatewaze/charts/gatewaze
          subject-digest: ${{ steps.oci.outputs.digest }}
          push-to-registry: true

      - name: Checkout gh-pages branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update Helm repo index
        run: |
          cp .helm-packages/*.tgz gh-pages/
          helm repo index gh-pages --url https://gatewaze.github.io/gatewaze

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish Helm chart ${{ steps.version.outputs.VERSION }}"
          git push
