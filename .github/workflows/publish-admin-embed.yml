name: Publish admin-embed

# Publishes @gatewaze/admin-embed to npm at whatever version
# packages/admin-embed/package.json currently declares.
#
# The package is the LOADER only: a small, dependency-free module that
# fetches the admin bundle a Gatewaze deployment serves under /embed/. The
# bundle itself ships inside the admin image (release.yml), so this workflow
# needs no module repos and no Vite build — just the loader's own compile.
#
# Deliberately NOT tied to the `v*` release tags: the loader changes only
# when the host contract does, which is rare, while images ship constantly.
#
# Bump the version in packages/admin-embed/package.json, merge, then run
# this workflow against that ref.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack only, do not publish'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish @gatewaze/admin-embed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm publish --provenance (keyless SLSA provenance)
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Not --frozen-lockfile: the workspace spans two repositories, so the
      # lockfile can legitimately disagree with the modules repo even when
      # this job never touches it.
      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build the loader
        run: node packages/admin-embed/scripts/build.mjs

      - name: Publish
        working-directory: packages/admin-embed
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "Resolved version: $VERSION"

          if [ "$DRY_RUN" = "true" ]; then
            npm pack --dry-run
            echo "::notice::dry_run — built and packed @gatewaze/admin-embed@$VERSION without publishing"
            exit 0
          fi

          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not configured — cannot publish"
            exit 1
          fi

          # Re-run safety: npm rejects a duplicate version anyway, but failing
          # here says why rather than surfacing a registry error.
          if npm view "@gatewaze/admin-embed@$VERSION" version > /dev/null 2>&1; then
            echo "::error::@gatewaze/admin-embed@$VERSION is already published — bump the version first"
            exit 1
          fi

          npm publish --access public --provenance
