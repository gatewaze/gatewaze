apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gatewaze.fullname" . }}-admin
  labels:
    {{- include "gatewaze.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.replicaCount.admin }}
  selector:
    matchLabels:
      {{- include "gatewaze.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        {{- include "gatewaze.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: admin
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gatewaze.serviceAccountName" . }}
      containers:
        - name: admin
          image: "{{ .Values.image.registry }}/admin:{{ include "gatewaze.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "gatewaze.fullname" . }}-config
            - secretRef:
                name: {{ include "gatewaze.secretName" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            # nginx only binds once a bundle exists to serve, so /healthz
            # answering IS "startup finished" — on the fast path (bundle baked
            # into the image) that is ~5s; on the slow path (pnpm install +
            # module clone + vite build) it is 3-5 minutes. 5s + 60×10s gives a
            # ~10min budget, comfortably above the slow path.
            #
            # This replaces initialDelaySeconds 240/300 on the two probes below.
            # A fixed delay charges the slow path's cost to every pod, including
            # fast-path ones that were serving 235 seconds earlier, and because
            # `helm upgrade --wait` cannot see a pod ready inside 4 minutes it
            # outran the deploy timeout and left autodb's release marked `failed`
            # for nine days across two revisions while every pod was healthy.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            # Does not begin until the startupProbe above has succeeded once,
            # so it needs no delay of its own — from here on, /healthz failing
            # means nginx has actually stopped serving.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # Likewise gated behind the startupProbe. A pod reaches Ready as
            # soon as it is genuinely serving rather than on a wall clock.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.admin | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gatewaze.fullname" . }}-admin
  labels:
    {{- include "gatewaze.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  # Each admin replica builds its own Vite bundle at pod startup (the
  # admin Docker entrypoint runs `vite build`). If two replicas' clones
  # produce different content hashes, their lazy-loaded chunk filenames
  # diverge — a client that loads index.html from pod A then fetches a
  # chunk from pod B hits 404. Pin each client to a single backend so
  # chunk requests stay on the pod that served their entry bundle.
  # Proper fix: build once at image build time. See docker/admin/Dockerfile.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gatewaze.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin
