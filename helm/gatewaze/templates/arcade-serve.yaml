{{- if (.Values.arcadeServe).enabled }}
{{- $arcade := .Values.arcadeServe }}
###############################################################################
# arcade-serve — the games origin (PLAY_ORIGIN, e.g. play.aaif.dev).
#
# Normative (spec-arcade-module.md §3): this is the ONLY application behind that
# host. It serves /g/* (versioned game snapshots read from the private `arcade`
# storage bucket, gated by the version manifest), /sdk/* (the browser SDK), and
# /healthz + /readyz + /metrics, which are cluster-internal ONLY — the Ingress
# below publishes /g and /sdk and nothing else.
#
# Read-only by construction: no insert/update/delete path exists in the image
# (asserted by the package's read-only test). Give it a SELECT-only credential
# where the platform allows one — `arcadeServe.supabaseKey`, falling back to the
# release service-role key only when that is not yet provisioned (spec §13).
#
# It never receives ARCADE_TOKEN_SECRET; that belongs to the module API. It only
# holds ARCADE_PREVIEW_HMAC_SECRET, to validate admin preview links.
#
# Toggle: add an `arcadeServe:` block to values-{brand}.yaml with
# `enabled: true` (see packages/arcade-serve/README.md for the full block).
###############################################################################
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gatewaze.fullname" . }}-arcade-serve
  labels:
    {{- include "gatewaze.labels" . | nindent 4 }}
    app.kubernetes.io/component: arcade-serve
spec:
  replicas: {{ $arcade.replicaCount | default 2 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "gatewaze.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: arcade-serve
  template:
    metadata:
      labels:
        {{- include "gatewaze.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: arcade-serve
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: arcade-serve
          image: "{{ ($arcade.image).repository | default (printf "%s/arcade-serve" .Values.image.registry) }}:{{ ($arcade.image).tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ ($arcade.image).pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            # Both origins are explicit per-brand values, never derived from the
            # Host header (spec §Terminology).
            - name: ARCADE_PLAY_ORIGIN
              value: {{ required "arcadeServe.playOrigin is required (e.g. https://play.aaif.dev)" $arcade.playOrigin | quote }}
            - name: ARCADE_PORTAL_ORIGIN
              value: {{ required "arcadeServe.portalOrigin is required (e.g. https://aaif.dev)" $arcade.portalOrigin | quote }}
            - name: ARCADE_STORAGE_BUCKET
              value: {{ $arcade.storageBucket | default "arcade" | quote }}
            - name: ARCADE_STRICT_HOST
              value: {{ $arcade.strictHost | default false | quote }}
            # SUPABASE_URL is not a secret — it lives in the release configmap
            # (values.supabase.url); the release secret has no such key.
            - name: SUPABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "gatewaze.fullname" . }}-config
                  key: SUPABASE_URL
            - name: ARCADE_SUPABASE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gatewaze.fullname" . }}-arcade-serve-secrets
                  key: supabaseKey
            - name: ARCADE_PREVIEW_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "gatewaze.fullname" . }}-arcade-serve-secrets
                  key: previewHmacSecret
            - name: ARCADE_PREVIEW_HMAC_SECRET_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "gatewaze.fullname" . }}-arcade-serve-secrets
                  key: previewHmacSecretPrevious
                  optional: true
          resources:
            requests:
              cpu: {{ (($arcade.resources).requests).cpu | default "50m" }}
              memory: {{ (($arcade.resources).requests).memory | default "128Mi" }}
            limits:
              cpu: {{ (($arcade.resources).limits).cpu | default "500m" }}
              memory: {{ (($arcade.resources).limits).memory | default "512Mi" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gatewaze.fullname" . }}-arcade-serve
  labels:
    {{- include "gatewaze.labels" . | nindent 4 }}
    app.kubernetes.io/component: arcade-serve
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "gatewaze.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: arcade-serve
---
###############################################################################
# Secret — the read-only DB credential and the preview-link HMAC secret.
# ARCADE_TOKEN_SECRET is deliberately NOT here (module API only, spec §13).
###############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gatewaze.fullname" . }}-arcade-serve-secrets
  labels:
    {{- include "gatewaze.labels" . | nindent 4 }}
    app.kubernetes.io/component: arcade-serve
type: Opaque
stringData:
  # Prefer a dedicated SELECT-only credential; falls back to the release
  # service-role key only until one is provisioned.
  supabaseKey: {{ $arcade.supabaseKey | default .Values.supabase.serviceRoleKey | quote }}
  previewHmacSecret: {{ required "arcadeServe.previewHmacSecret is required" $arcade.previewHmacSecret | quote }}
  previewHmacSecretPrevious: {{ $arcade.previewHmacSecretPrevious | default "" | quote }}
{{- if ($arcade.ingress).enabled }}
---
###############################################################################
# Ingress — play.<domain>. ONLY the public paths are routed here: /g and /sdk.
# /healthz, /readyz and /metrics are intentionally absent, so they stay
# reachable only in-cluster (spec §13). Do not add a `/` catch-all rule.
###############################################################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gatewaze.fullname" . }}-arcade-serve
  labels:
    {{- include "gatewaze.labels" . | nindent 4 }}
    app.kubernetes.io/component: arcade-serve
  {{- with ($arcade.ingress).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ ($arcade.ingress).className | default .Values.ingress.className | quote }}
  {{- if (($arcade.ingress).tls).enabled }}
  tls:
    - secretName: {{ (($arcade.ingress).tls).secretName }}
      hosts:
        - {{ required "arcadeServe.ingress.host is required (e.g. play.aaif.dev)" ($arcade.ingress).host | quote }}
  {{- end }}
  rules:
    - host: {{ required "arcadeServe.ingress.host is required (e.g. play.aaif.dev)" ($arcade.ingress).host | quote }}
      http:
        paths:
          - path: /g
            pathType: Prefix
            backend:
              service:
                name: {{ include "gatewaze.fullname" . }}-arcade-serve
                port:
                  number: 8080
          - path: /sdk
            pathType: Prefix
            backend:
              service:
                name: {{ include "gatewaze.fullname" . }}-arcade-serve
                port:
                  number: 8080
{{- end }}
---
###############################################################################
# NetworkPolicy — ingress on 8080 only. The operational endpoints are kept off
# the public host by the Ingress path list above; Prometheus and the kubelet
# reach /metrics and the probes in-cluster on the same port.
###############################################################################
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gatewaze.fullname" . }}-arcade-serve
  labels:
    {{- include "gatewaze.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gatewaze.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: arcade-serve
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      {{- /*
        Unlike events-mcp/browser-mcp, this service takes PUBLIC traffic (/g, /sdk)
        through the ingress controller, so it cannot be scoped to an app-label
        podSelector. Left open by default so a fresh install serves games; set
        `arcadeServe.networkPolicy.from` to the ingress-controller and monitoring
        namespaces to close /readyz (which makes a DB round-trip) and /metrics to
        arbitrary in-cluster pods. Example:

          arcadeServe:
            networkPolicy:
              from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: ingress-nginx
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: monitoring
      */}}
      {{- with ((.Values.arcadeServe).networkPolicy).from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
