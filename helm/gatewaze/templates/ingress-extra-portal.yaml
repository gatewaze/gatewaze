{{- if .Values.ingress.enabled }}
{{- range .Values.ingress.extraPortalHosts }}
{{- $slug := .host | lower | replace "." "-" }}
---
# Extra portal host: {{ .host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gatewaze.fullname" $ }}-portal-{{ $slug }}
  labels:
    {{- include "gatewaze.labels" $ | nindent 4 }}
  {{- with $.Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $.Values.ingress.className | quote }}
  {{- if $.Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ .tlsSecretName | default (printf "%s-portal-%s-tls" (include "gatewaze.fullname" $) $slug) | quote }}
      hosts:
        - {{ .host | quote }}
  {{- end }}
  rules:
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gatewaze.fullname" $ }}-portal
                port:
                  number: 3100
{{- end }}
{{- end }}
